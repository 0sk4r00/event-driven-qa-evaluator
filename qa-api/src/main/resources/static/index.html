<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System QA - Ewaluacja LLM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            background-color: #2b8a3e;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #217031;
        }
        button:disabled {
            background-color: #a5d8a7;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2ff;
            border-left: 4px solid #4c6ef5;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <button onclick="loadQuestion()">Pobierz losowe pytanie</button>

    <h3 id="question-text" style="margin-top: 20px;">Kliknij przycisk powyżej, aby rozpocząć...</h3>
    <input type="hidden" id="question-id">

    <div id="answer-section" style="display: none;">
        <label for="user-answer"><strong>Twoja odpowiedź:</strong></label>
        <textarea id="user-answer" placeholder="Wpisz tutaj swoją odpowiedź..."></textarea>

        <button id="submit-btn" onclick="submitAnswer()">Wyślij do oceny (Llama 3.3)</button>
    </div>

    <div id="status"></div>

    <div id="result-box">
        <strong>Ocena AI:</strong>
        <p id="evaluation-text" style="margin-bottom: 0; white-space: pre-wrap;"></p>
    </div>
</div>

<script>
    let currentEventSource = null;

    // 1. Pobieranie losowego pytania z backendu
    async function loadQuestion() {
        // Resetujemy stan widoku
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('status').innerText = '';
        document.getElementById('user-answer').value = '';

        if (currentEventSource) {
            currentEventSource.close(); // Zamknij ewentualne stare połączenie SSE
        }

        try {
            const response = await fetch('http://localhost:8080/api/questions/random');
            if (!response.ok) throw new Error("Błąd pobierania pytania");

            const data = await response.json();
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('question-id').value = data.id;
            document.getElementById('answer-section').style.display = 'block';
        } catch (err) {
            document.getElementById('question-text').innerText = "Błąd podczas ładowania pytania!";
            console.error(err);
        }
    }

    // 2. Wysyłanie odpowiedzi i otwieranie połączenia SSE
    async function submitAnswer() {
        const questionId = document.getElementById('question-id').value;
        const userAnswer = document.getElementById('user-answer').value;
        const questionText = document.getElementById('question-text').innerText;

        const submitBtn = document.getElementById('submit-btn');
        const statusDiv = document.getElementById('status');
        const resultBox = document.getElementById('result-box');
        const evalText = document.getElementById('evaluation-text');

        if (!userAnswer.trim()) {
            alert("Wpisz odpowiedź przed wysłaniem!");
            return;
        }

        // Zablokuj przycisk na czas przetwarzania
        submitBtn.disabled = true;
        resultBox.style.display = 'none';
        statusDiv.innerText = "Nawiązywanie połączenia i czyszczenie kolejki...";

        // A. OTWIERAMY POŁĄCZENIE SSE (Czekamy na zdarzenie z backendu)
        currentEventSource = new EventSource(`http://localhost:8080/api/questions/subscribe/${questionId}`);

        currentEventSource.addEventListener("INIT", (event) => {
            console.log("Połączenie SSE zestawione pomyślnie.");
        });

        // Nasłuchujemy zdarzenia wysłanego ze Springa (SseEmitter.event().name("evaluation-result"))
        currentEventSource.addEventListener("evaluation-result", (event) => {
            statusDiv.innerText = "Wynik odebrany!";
            evalText.innerText = event.data;
            resultBox.style.display = 'block';

            submitBtn.disabled = false;
            currentEventSource.close(); // Zamykamy strumień po odebraniu pojedynczego wyniku
        });

        currentEventSource.onerror = (error) => {
            console.error("Błąd połączenia SSE:", error);
            statusDiv.innerText = "Błąd połączenia lub przekroczono czas oczekiwania (timeout).";
            submitBtn.disabled = false;
            currentEventSource.close();
        };

        // B. WYSYŁAMY ODPOWIEDŹ (Przechodzi przez Redpandę do qa-evaluator i Groq LLM)
        try {
            statusDiv.innerText = "Ewaluacja w toku... Czekam na odpowiedź z Llama 3.3 (Groq)...";

            await fetch('http://localhost:8080/api/questions/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: questionId,
                    question: questionText,
                    userAnswer: userAnswer
                })
            });
        } catch (err) {
            statusDiv.innerText = "Błąd podczas wysyłania odpowiedzi!";
            submitBtn.disabled = false;
            currentEventSource.close();
        }
    }
</script>

</body>
</html>
