spring.application.name=qa-evaluator

server.port=8081

# KAFKA CONFIGURATION
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.qaevaluator.dto.QuestionDTO
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# SPRING AI / GROQ CONFIGURATION
spring.ai.openai.api-key=${API_TOKEN}
grok.api.key=${API_TOKEN}

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
