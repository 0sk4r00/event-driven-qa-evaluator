services:
  # 1. KAFKA (KRaft - bez Zookeepera)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 2. AKHQ (GUI do podglądu tematów i wiadomości w Kafce)
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8082:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      - kafka

  # 3. MODUŁ QA-API (Producent)
  qa-api:
    build:
      context: ./qa-api
      dockerfile: Dockerfile
    container_name: qa-api
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  # 4. MODUŁ QA-EVALUATOR (Konsument + LLM)
  qa-evaluator:
    build:
      context: ./qa-evaluator
      dockerfile: Dockerfile
    container_name: qa-evaluator
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - kafka